# R CMD check + test-coverage CI
#
# Runs on every push and pull request. Heavy vignettes (stablr-multiomic,
# stablr-tcga, stablr-tcga-nestedcv) are gated to eval=FALSE in their
# setup chunks so they do not execute during the check build.
#
# Coverage is uploaded through Codecov v5; a missing third-party token is not a
# package-check failure. The cooperative multiview backend is vendored and
# compiled with the package, so CI does not install an external multiview copy.

on:
  push:
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel"   }
          - { os: ubuntu-latest, r: "oldrel-1" }
          - { os: macos-latest,  r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-22.04, r: "4.1", minimal: true }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install knitr from source on macOS
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          install.packages(
            "knitr",
            repos = "https://cloud.r-project.org",
            type = "source"
          )

      - name: Install full check dependencies
        if: matrix.config.minimal != true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install minimum-R check dependencies
        if: matrix.config.minimal == true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::ggplot2

      - name: Check package
        if: matrix.config.minimal != true
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Check package at declared minimum R
        if: matrix.config.minimal == true
        uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          upload-snapshots: true

      - name: Publish failed check diagnostics
        if: failure()
        shell: bash
        run: |
          check_log=$(find check -name 00check.log -print -quit)
          test_log=$(find check -name 'testthat.Rout*' -print -quit)
          details=""
          if [ -n "$check_log" ]; then
            details="$(tail -n 120 "$check_log")"
          fi
          if [ -n "$test_log" ]; then
            details="$details

          TESTTHAT TAIL
          $(tail -n 120 "$test_log")"
          fi
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error file=.github,title=R CMD check diagnostics::$details"

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.config.os }}-r-${{ matrix.config.r }}
          path: check
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    needs: R-CMD-check

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Generate Cobertura coverage
        run: |
          coverage <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"),
                                                   winslash = "/"), "package")
          )
          covr::to_cobertura(coverage, filename = "coverage.xml")
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
