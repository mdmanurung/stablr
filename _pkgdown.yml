url: https://mdmanurung.github.io/stablr/

authors:
  "Mikaël Manurung":
    href: https://github.com/mdmanurung

destination: _site

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex

home:
  title: stablr
  description: >
    R-native STABL implementation without a Python runtime for reliable single-omic and
    multi-omic biomarker discovery.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/stablr-intro.html
    articles:
      text: Vignettes
      menu:
      - text: Getting started with stabl
        href: articles/stablr-getting-started.html
      - text: Quick start (expert interface)
        href: articles/stablr-intro.html
      - text: Multi-omic OOL workflow
        href: articles/stablr-multiomic.html
      - text: TCGA Breast Cancer workflow
        href: articles/stablr-tcga.html
      - text: TCGA nested CV and DIABLO
        href: articles/stablr-tcga-nestedcv.html
      - text: Cooperative fusion
        href: articles/stablr-cooperative.html
      - text: Environment stability
        href: articles/stablr-environments.html
      - text: "---------"
      - text: Aging case study
        href: articles/stablr-aging-case-study.html
      - text: Advanced workflows
        href: articles/stablr-advanced.html
    github:
      icon: fa-github
      href: https://github.com/mdmanurung/stablr
      aria-label: GitHub

reference:
- title: Package Overview
  contents:
  - stablr-package

- title: Getting started
  desc: The one-stop-shop entry point for new users — a data.frame in, a
    plain-language selection out.
  contents:
  - stabl
  - print.stabl
  - summary.stabl
  - plot.stabl
  - support
  - feature_names

- title: Core STABL Engine
  desc: Fit single-matrix STABL selectors and compute FDP+ thresholds
    (expert interface).
  contents:
  - stabl_fit
  - auto_lambda_grid
  - compute_fdp_plus

- title: Knockoff Feature Construction
  desc: Factories that inject artificial features (Model-X knockoffs or
    random permutations) for FDP+ calibration; plug into stabl_fit through
    the knockoff/solver arguments.
  contents:
  - make_knockoff_features
  - make_knockoff_equi_features
  - make_knockoff_mvr_features
  - make_rp_features

- title: Learner Adapters
  desc: Public learner factories for glmnet-family and sparse-group backends.
  contents:
  - make_glmnet_adapter
  - make_adaptive_lasso_adapter
  - make_sgl_adapter

- title: Extended Learner Adapters
  desc: Extensions beyond the glmnet family. The random forest is calibrated
    within a measured scope (WS-2); the oblique forest is fenced (WS-3); the
    ordinal learner is experimental (WS-9).
  contents:
  - make_ranger_adapter
  - auto_rf_threshold_grid
  - make_aorsf_adapter
  - auto_oblique_threshold_grid
  - make_ordinal_adapter
  - auto_ordinal_lambda_grid

- title: Environment Stability
  desc: ICP-inspired transportability workflow across environments (batches,
    cohorts, sites); promoted with a documented scope after the WS-5
    transportability benchmark (min-aggregation is the calibrated read).
  contents:
  - stabl_environment_stability
  - get_min_scores
  - print.stabl_env_stability

- title: Artificial Features
  desc: Decoy-feature generation for FDP+ calibration.
  contents:
  - make_artificial_features

- title: Input Validation and Bootstrapping
  contents:
  - validate_sample_alignment
  - validate_multiomic_inputs
  - sample_bootstrap_indices
  - group_bootstrap_indices

- title: Accessors
  contents:
  - get_support
  - get_feature_names
  - get_fdrs
  - transform_stabl
  - get_stabl_scores
  - get_importances
  - get_lambda_grid
  - get_cooperative_features
  - get_cooperative_diagnostics

- title: Multi-Omic Workflows
  contents:
  - stabl_multiomic_train_validate
  - stabl_multiomic_cv
  - stabl_multiomic_nested_cv
  - stabl_multiomic_stacked
  - stabl_multiomic_study_diagnostics
  - stabl_multiomic_study_split
  - stabl_multiomic_scheme_comparison
  - stabl_multiomic_selection_stability
  - load_ool_data

- title: Analysis Workflow
  desc: Explicit exploratory/validated analysis with canonical evidence
    tables and fold-safe preprocessing.
  contents:
  - stabl_analyze
  - stabl_interpret
  - stabl_preprocess_fit
  - stabl_preprocess_apply
  - stabl_preprocess_fit_recipes

- title: Visualization
  contents:
  - plot_stabl_path
  - plot_fdr_graph
  - plot_roc
  - plot_prc
  - boxplot_features
  - scatterplot_features

- title: Plot a fitted stabl_fit
  desc: S3 plot method for fitted STABL objects (stability path and FDP+ graph).
  contents:
  - plot.stabl_fit

- title: Summarise a fitted stabl_fit
  desc: S3 summary and print methods for fitted STABL objects.
  contents:
  - summary.stabl_fit
  - print.summary.stabl_fit

- title: Export
  contents:
  - export_stabl_to_csv
  - save_stabl_results

- title: Selection Similarity Metrics
  contents:
  - jaccard_similarity
  - jaccard_similarity_matrix
  - adjusted_similarity
  - adjusted_similarity_pairwise
  - adjusted_similarity_summary
  - pearson_similarity
  - pearson_similarity_pairwise
  - pearson_similarity_summary
  - fdr_similarity
  - tpr_similarity
  - fscore_similarity

- title: Deprecated names
  desc: Old names kept as deprecation shims; they warn once and delegate to
    the replacements above.
  contents:
  - jaccard_matrix
  - adjusted_similarity_values
  - adjusted_similarity_measure
  - pearson_similarity_values
  - pearson_similarity_measure
  - get_feature_names_out
  - classic_bootstrap_indices
  - stacked_multi_omic

articles:
- title: Workflows
  navbar: ~
  contents:
  - stablr-getting-started
  - stablr-intro
  - stablr-multiomic
  - stablr-tcga
  - stablr-tcga-nestedcv
  - stablr-cooperative
  - stablr-environments
  - stablr-aging-case-study
  - stablr-advanced
