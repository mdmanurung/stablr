url: https://mdmanurung.github.io/stablr/

authors:
  "Mikaël Manurung":
    href: https://github.com/mdmanurung

destination: _site

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex

home:
  title: stablr
  description: >
    R-native STABL implementation without a Python runtime for reliable single-omic and
    multi-omic biomarker discovery.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/stablr-intro.html
    articles:
      text: Vignettes
      menu:
      - text: Getting started with stabl
        href: articles/stablr-getting-started.html
      - text: Python STABL parity (pinned snapshot)
        href: articles/stablr-python-parity.html
      - text: Reading stability paths and FDP+ plots
        href: articles/stablr-reading-plots.html
      - text: Reliability, validation, and final models
        href: articles/stablr-reliability.html
      - text: Quick start (expert interface)
        href: articles/stablr-intro.html
      - text: Multi-omic OOL workflow
        href: articles/stablr-multiomic.html
      - text: TCGA Breast Cancer workflow
        href: articles/stablr-tcga.html
      - text: TCGA nested CV and DIABLO
        href: articles/stablr-tcga-nestedcv.html
      - text: Cooperative fusion
        href: articles/stablr-cooperative.html
      - text: Environment stability
        href: articles/stablr-environments.html
      - text: cEBMF-denoised expression
        href: articles/stablr-cebmf.html
      - text: Metacell aggregation
        href: articles/stablr-metacells.html
      - text: "---------"
      - text: Aging case study
        href: articles/stablr-aging-case-study.html
      - text: Advanced workflows
        href: articles/stablr-advanced.html
    github:
      icon: fa-github
      href: https://github.com/mdmanurung/stablr
      aria-label: GitHub

reference:
- title: Package Overview
  contents:
  - stablr-package

- title: Getting started
  desc: The one-stop-shop entry point for new users — a data.frame in, a
    plain-language selection out.
  contents:
  - stabl
  - print.stabl
  - summary.stabl
  - plot.stabl

- title: Core STABL Engine
  desc: Fit single-matrix STABL selectors and compute FDP+ thresholds
    (expert interface).
  contents:
  - stabl_fit
  - auto_lambda_grid
  - compute_fdp_plus

- title: Environment Stability
  desc: ICP-inspired transportability workflow across environments (batches,
    cohorts, sites); promoted with a documented scope after the WS-5
    transportability benchmark (min-aggregation is the calibrated read).
  contents:
  - stabl_environment_stability
  - get_min_scores
  - print.stabl_env_stability

- title: Accessors
  contents:
  - get_support
  - get_feature_names
  - get_fdrs
  - transform_stabl
  - get_stabl_scores
  - get_importances
  - get_lambda_grid
  - get_cooperative_features
  - get_cooperative_diagnostics

- title: Multi-Omic Workflows
  contents:
  - stabl_multiomic_train_validate
  - stabl_multiomic_cv
  - stabl_multiomic_nested_cv
  - stabl_multiomic_stacked
  - stabl_multiomic_study_diagnostics
  - stabl_multiomic_scheme_comparison
  - stabl_multiomic_selection_stability
  - load_ool_data

- title: Analysis Workflow
  desc: Explicit exploratory/validated analysis with canonical evidence
    tables and fold-safe preprocessing.
  contents:
  - stabl_analyze
  - stabl_interpret
  - summary.stabl_interpretation
  - plot.stabl_interpretation
  - stabl_preprocess_fit
  - stabl_preprocess_apply
  - print.stabl_analysis
  - summary.stabl_analysis

- title: Reliability and Final Models
  desc: Post-selection reliability diagnostics, outcome-null validation,
    cohort replication, and portable final models (Phase 13; see the
    stablr-reliability article for a guided tour).
  contents:
  - stabl_diagnose
  - print.stabl_diagnostics
  - plot.stabl_diagnostics
  - stabl_null_check
  - print.stabl_null_validation
  - plot.stabl_null_validation
  - stabl_replication_profile
  - print.stabl_replication_profile
  - stabl_finalize
  - print.stabl_predictor
  - predict.stabl_predictor

- title: Visualization
  contents:
  - plot_stabl_path
  - plot_fdr_graph

- title: Plot a fitted stabl_fit
  desc: S3 plot method for fitted STABL objects (stability path and FDP+ graph).
  contents:
  - plot.stabl_fit

- title: Summarise a fitted stabl_fit
  desc: S3 summary and print methods for fitted STABL objects.
  contents:
  - summary.stabl_fit
  - print.summary.stabl_fit

- title: Export
  desc: Single entry point for persisting results — CSV tables only
    (what = "csv") or the full results bundle (default what = "all").
  contents:
  - save_stabl_results

- title: Selection Similarity Metrics
  desc: Reproducibility of selected feature sets across runs — one pairwise
    verb with three methods, plus a one-number summary.  The eight 0.3.0
    similarity names remain as deprecated shims until 1.0.0 and are
    intentionally not listed here.
  contents:
  - stabl_similarity
  - stabl_similarity_summary

articles:
- title: Workflows
  navbar: ~
  contents:
  - stablr-getting-started
  - stablr-intro
  - stablr-multiomic
  - stablr-tcga
  - stablr-tcga-nestedcv
  - stablr-cooperative
  - stablr-environments
  - stablr-aging-case-study
  - stablr-advanced

- title: Parity and plot interpretation
  navbar: ~
  contents:
  - stablr-python-parity
  - stablr-reading-plots

- title: Reliability and validation
  navbar: ~
  contents:
  - stablr-reliability

- title: Single-cell integrations
  navbar: ~
  contents:
  - stablr-cebmf
  - stablr-metacells
